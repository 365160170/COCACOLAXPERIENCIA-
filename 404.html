<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página no encontrada · La magia de compartir</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #100d0b;
        color: #f7ebdd;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      main {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        box-sizing: border-box;
      }
      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 400;
        font-size: clamp(2.25rem, 8vw, 4.5rem);
        line-height: 1.05;
        margin: 0 0 16px;
      }
      em {
        color: #e9b96e;
      }
      p {
        margin: 0 0 32px;
        color: rgb(247 235 221 / 0.78);
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 52px;
        padding: 0 24px;
        border-radius: 999px;
        background: #e41e2b;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #e9b96e;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Esta calle no lleva <em>a ningún sitio</em></h1>
        <p>La página que buscas no existe. El pueblo sigue encendido en la portada.</p>
        <a id="home" href="/">Volver al inicio</a>
      </div>
    </main>
    <script>
      // En GitHub Pages el sitio vive en /<repositorio>/.
      if (location.hostname.endsWith('github.io')) {
        var repo = location.pathname.split('/')[1];
        if (repo) document.getElementById('home').href = '/' + repo + '/';
      }
    </script>
  </body>
</html>
